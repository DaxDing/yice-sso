# yice-sso browser entry. Paste into the parent-domain server block of the site's nginx config,
# above "location /". Only /sso/ is proxied; the /v1 API is never reachable through nginx.
# Needs in the http block:  limit_req_zone $binary_remote_addr zone=yice_sso_authorize:10m rate=10r/m;

location = /sso/callback {
    # The query carries the OAuth code and state: never log it.
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8773;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /sso/authorize {
    limit_req zone=yice_sso_authorize burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8773;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location ^~ /sso/ {
    proxy_pass http://127.0.0.1:8773;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
